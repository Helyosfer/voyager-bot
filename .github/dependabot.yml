# Bağımlılıklar ve iş akışındaki eylemler için haftalık güncelleme önerileri (pull request olarak gelir)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
